  nav a.primary { background: #6259e8; color: #fff; }

  /* dark theme (toggle: /js/theme-init.js + /js/mdo-theme-toggle.js). #E5E7EB on #1A1A2E 13.6:1, #C3C6DA 9.9:1, #B9B2FF 8.2:1 */
  html[data-theme="dark"] body { background: #0F0F1A; color: #E5E7EB; }
  html[data-theme="dark"] header a { color: #FFFFFF; }
  html[data-theme="dark"] header img { filter: invert(1); }
  html[data-theme="dark"] .card { background: #1A1A2E; box-shadow: none; border: 1px solid #3A3A5A; }
  html[data-theme="dark"] h1 { color: #FFFFFF; }
  html[data-theme="dark"] p { color: #C3C6DA; }
  html[data-theme="dark"] nav a { color: #B9B2FF; border-color: #B9B2FF; }
  html[data-theme="dark"] nav a.primary { background: #6259e8; border-color: #6259e8; color: #FFFFFF; }
  html[data-theme="dark"] a:focus-visible { outline-color: #B9B2FF; }
</style>
